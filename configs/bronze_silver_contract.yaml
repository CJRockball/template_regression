# Bronze dataset configuration and contract
project:
  name: kaggle_s6e11_credit_card_fraud
  description: Kaggle competition s6r11 on credit card fraud

data_paths:
  database: data/project.db
  raw_data: data/raw
  processed_data: data/processed
  artifacts: artifacts
  logs: logs

data:
  adapter: None
  source: data/raw/combined.csv
  format: csv
  entity_id: id
  target: is_fraud
  task: binary_classification
  positive_label: 1

# Minimal technical & structural contract for Bronze ingestion
bronze_source_contract:
  rows: 719960
  columns: 27
  col_names:
    - "id"
    - "account_balance_usd"
    - "amount_usd"
    - "auth_method"
    - "billing_shipping_mismatch"
    - "card_age_months"
    - "card_type"
    - "channel"
    - "customer_age"
    - "cvv_retry_count"
    - "day_of_week"
    - "device_type"
    - "distance_from_home_km"
    - "hours_since_last_txn"
    - "ip_country_mismatch"
    - "is_ai_generated_scam_attempt"
    - "is_foreign_transaction"
    - "is_fraud"
    - "is_new_merchant"
    - "merchant_category"
    - "merchant_risk_score"
    - "prior_disputes"
    - "time_of_day_hour"
    - "txn_count_last_24h"
    - "used_vpn"
    - "velocity_score"
    - "data_type"

  # Semantic column role classification for column_registry
  roles:
    id: ["id"]
    feature:
      - "account_balance_usd"
      - "amount_usd"
      - "auth_method"
      - "billing_shipping_mismatch"
      - "card_age_months"
      - "card_type"
      - "channel"
      - "customer_age"
      - "cvv_retry_count"
      - "day_of_week"
      - "device_type"
      - "distance_from_home_km"
      - "hours_since_last_txn"
      - "ip_country_mismatch"
      - "is_ai_generated_scam_attempt"
      - "is_foreign_transaction"
      - "is_new_merchant"
      - "merchant_category"
      - "merchant_risk_score"
      - "prior_disputes"
      - "time_of_day_hour"
      - "txn_count_last_24h"
      - "used_vpn"
      - "velocity_score"
    target: ["is_fraud"]

# Business-level validation (enforced downstream in Silver / EDA)
validation:
  required_columns:
    - "id"
    - "account_balance_usd"
    - "amount_usd"
    - "auth_method"
    - "billing_shipping_mismatch"
    - "card_age_months"
    - "card_type"
    - "channel"
    - "customer_age"
    - "cvv_retry_count"
    - "day_of_week"
    - "device_type"
    - "distance_from_home_km"
    - "hours_since_last_txn"
    - "ip_country_mismatch"
    - "is_ai_generated_scam_attempt"
    - "is_foreign_transaction"
    - "is_fraud"
    - "is_new_merchant"
    - "merchant_category"
    - "merchant_risk_score"
    - "prior_disputes"
    - "time_of_day_hour"
    - "txn_count_last_24h"
    - "used_vpn"
    - "velocity_score"
    - "data_type"
  allowed_target_values: [0,1]
  require_unique_entity_id: true
  max_missing_rate: 0.1

