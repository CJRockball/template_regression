# Bronze dataset configuration and contract
project:
  name: concrete_regression
  description: Small dataset to predict compressive strength of concrete

data_paths:
  database: data/project.db
  raw_data: data/raw
  processed_data: data/processed
  artifacts: artifacts
  logs: logs

data:
  adapter: None
  source: data/raw/concrete.csv
  format: csv
  entity_id: id
  target: "Concrete compressive strength(MPa, megapascals)"
  task: regression

# Minimal technical & structural contract for Bronze ingestion
bronze_source_contract:
  rows: 1030
  columns: 10
  col_names:
    - "id"
    - "Cement (component 1)(kg in a m^3 mixture)"
    - "Blast Furnace Slag (component 2)(kg in a m^3 mixture)"
    - "Fly Ash (component 3)(kg in a m^3 mixture)"
    - "Water  (component 4)(kg in a m^3 mixture)"
    - "Superplasticizer (component 5)(kg in a m^3 mixture)"
    - "Coarse Aggregate  (component 6)(kg in a m^3 mixture)"
    - "Fine Aggregate (component 7)(kg in a m^3 mixture)"
    - "Age (day)"
    - "Concrete compressive strength(MPa, megapascals)"

  # Semantic column role classification for column_registry
  roles:
    id: ["id"]
    feature:
      - "Cement (component 1)(kg in a m^3 mixture)"
      - "Blast Furnace Slag (component 2)(kg in a m^3 mixture)"
      - "Fly Ash (component 3)(kg in a m^3 mixture)"
      - "Water  (component 4)(kg in a m^3 mixture)"
      - "Superplasticizer (component 5)(kg in a m^3 mixture)"
      - "Coarse Aggregate  (component 6)(kg in a m^3 mixture)"
      - "Fine Aggregate (component 7)(kg in a m^3 mixture)"
      - "Age (day)"
    target: ["Concrete compressive strength(MPa, megapascals)"]

# Business-level validation (enforced downstream in Silver / EDA)
validation:
  required_columns:
    - "id"
    - "Cement (component 1)(kg in a m^3 mixture)"
    - "Blast Furnace Slag (component 2)(kg in a m^3 mixture)"
    - "Fly Ash (component 3)(kg in a m^3 mixture)"
    - "Water  (component 4)(kg in a m^3 mixture)"
    - "Superplasticizer (component 5)(kg in a m^3 mixture)"
    - "Coarse Aggregate  (component 6)(kg in a m^3 mixture)"
    - "Fine Aggregate (component 7)(kg in a m^3 mixture)"
    - "Age (day)"
    - "Concrete compressive strength(MPa, megapascals)"
  require_unique_entity_id: true
  max_missing_rate: 0.1

# silver contract from eda
silver_eda_contract:
  canonical_names:
    "id": "id"
    "Cement (component 1)(kg in a m^3 mixture)": "cement"
    "Blast Furnace Slag (component 2)(kg in a m^3 mixture)": "blast_furnace_slag" 
    "Fly Ash (component 3)(kg in a m^3 mixture)": "fly_ash"
    "Water  (component 4)(kg in a m^3 mixture)": "water"
    "Superplasticizer (component 5)(kg in a m^3 mixture)": "plasticizer"
    "Coarse Aggregate  (component 6)(kg in a m^3 mixture)": "coarse_aggregate"
    "Fine Aggregate (component 7)(kg in a m^3 mixture)": "fine_aggregate"
    "Age (day)": "age"
    "Concrete compressive strength(MPa, megapascals)": "strength" 

  canonical_dtypes:
    id: Int64
    cement: float64
    blast_furnace_slag: float64
    fly_ash: float64
    water: float64
    plasticizer: float64
    coarse_aggregate: float64
    fine_aggregate: float64
    age: int64
    strength: float64

  feature_types:
    numerical:
      - cement
      - blast_furnace_slag
      - fly_ash
      - water
      - plasticizer
      - coarse_aggregate
      - fine_aggregate
      - age

    nominal: []

    ordinal: []

  allowed_values: {}


  value_mappings: {}

  missingness:
    default_max_rate: 0.0
    max_rate_by_column: {}