# Merge into a NEW regression experiment before splitting or training.
# Fractions refer to the entire dataset; all remaining rows form development.
# These are not a request to edit any existing run, split or release.
split:
  method: random
  holdout_fraction: 0.2
  calibration_fraction: 0.15
  recalibration_fraction: 0.1  # Set to zero when correction will remain 'none'.
  n_folds: 5
  seed: 42
